<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Champagne Gold Gradients matching Palette 3 -->
    <linearGradient id="goldGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DFB7" />
      <stop offset="35%" stop-color="#D4B67F" />
      <stop offset="70%" stop-color="#B89A68" />
      <stop offset="100%" stop-color="#846535" />
    </linearGradient>
    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#E1C694" />
      <stop offset="100%" stop-color="#B89A68" />
    </linearGradient>
    <linearGradient id="goldGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7B47" />
      <stop offset="100%" stop-color="#6B4F23" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#B89A68" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="nordastrum-symbol" filter="url(#subtleGlow)" transform="translate(100, 100)">
    
    <!-- Outer Gear / Cog Wheel (Lower half & sides) -->
    <path d="M -54 8 
             A 55 55 0 0 0 54 8
             L 58 14 L 66 12 L 63 24 L 54 28
             A 55 55 0 0 0 38 46 L 44 54 L 34 61 L 25 54
             A 55 55 0 0 0 0 59 L 0 70 L -12 70 L -12 59
             A 55 55 0 0 0 -36 52 L -44 59 L -52 50 L -45 42
             A 55 55 0 0 0 -58 24 L -67 21 L -64 9 L -54 8 Z"
          fill="url(#goldGradientDark)" opacity="0.95" />
    
    <!-- Outer Gear Trim / Arc -->
    <path d="M -50 4 A 50 50 0 0 0 50 4" stroke="url(#goldGradientMain)" stroke-width="4" fill="none" stroke-linecap="round" />
    
    <!-- Petroleum Flame / Upward Liquid Droplet Outer Arc -->
    <path d="M 0 -78
             C 12 -58 35 -30 45 -4
             C 52 14 48 35 34 48
             C 22 58 3 62 -12 60
             C -32 57 -48 40 -48 18
             C -48 -6 -32 -28 -18 -48
             C -8 -62 -3 -70 0 -78 Z"
          stroke="url(#goldGradientMain)" stroke-width="6" fill="none" stroke-linejoin="round" />
    
    <!-- Flame Tail S-Curve Top Finial -->
    <path d="M 0 -78
             C -6 -65 -4 -45 2 -32
             C 7 -20 5 -5 0 8"
          stroke="url(#goldGradientLight)" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- 8-Point Compass / Star Center Assembly -->
    <g id="compass-star">
      <!-- Star Vertical North/South Points -->
      <!-- North Point -->
      <polygon points="0,0 -8,-10 0,-62" fill="url(#goldGradientLight)" />
      <polygon points="0,0 8,-10 0,-62" fill="url(#goldGradientDark)" />

      <!-- South Point -->
      <polygon points="0,0 8,10 0,54" fill="url(#goldGradientLight)" />
      <polygon points="0,0 -8,10 0,54" fill="url(#goldGradientDark)" />

      <!-- East Point -->
      <polygon points="0,0 10,-8 56,0" fill="url(#goldGradientLight)" />
      <polygon points="0,0 10,8 56,0" fill="url(#goldGradientDark)" />

      <!-- West Point -->
      <polygon points="0,0 -10,8 -56,0" fill="url(#goldGradientLight)" />
      <polygon points="0,0 -10,-8 -56,0" fill="url(#goldGradientDark)" />

      <!-- Diagonal NE Point -->
      <polygon points="0,0 3,-7 30,-30" fill="url(#goldGradientMain)" />
      <polygon points="0,0 7,-3 30,-30" fill="url(#goldGradientDark)" />

      <!-- Diagonal NW Point -->
      <polygon points="0,0 -7,-3 -30,-30" fill="url(#goldGradientLight)" />
      <polygon points="0,0 -3,-7 -30,-30" fill="url(#goldGradientMain)" />

      <!-- Diagonal SE Point -->
      <polygon points="0,0 7,3 30,30" fill="url(#goldGradientDark)" />
      <polygon points="0,0 3,7 30,30" fill="url(#goldGradientMain)" />

      <!-- Diagonal SW Point -->
      <polygon points="0,0 -3,7 -30,30" fill="url(#goldGradientDark)" />
      <polygon points="0,0 -7,3 -30,30" fill="url(#goldGradientLight)" />

      <!-- Center Star Core Hub Ring -->
      <circle cx="0" cy="0" r="6" fill="url(#goldGradientLight)" stroke="#503A1A" stroke-width="1.5" />
    </g>
  </g>
</svg>
